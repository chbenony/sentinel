name: Codex Pull Request Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  codex:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    env:
      # Codex's sandbox can only write inside the workspace, so Gradle's
      # caches and lock files must live there instead of ~/.gradle.
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Download the wrapper and dependencies and compile while network access
      # is available, so Codex can run the tests offline inside its sandbox.
      # Running the tests (not just testClasses) also resolves the test runtime
      # classpath (JUnit engine/launcher). A compile or test failure must not
      # skip the review, so the step may fail.
      - name: Warm up Gradle
        run: ./gradlew test --no-daemon
        continue-on-error: true
      # Trusted Codex config, written by the workflow (never read from the
      # checkout). Gradle's test workers talk to the build over loopback
      # sockets, so the profile allows local binding and loopback only;
      # the proxy blocks every external destination.
      - name: Configure Codex permissions
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cat > "$RUNNER_TEMP/codex-home/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.gradle-tests]
          description = "Workspace edits plus loopback networking for Gradle tests."
          extends = ":workspace"

          [permissions.gradle-tests.network]
          enabled = true
          allow_local_binding = true

          [permissions.gradle-tests.network.domains]
          "localhost" = "allow"
          "127.0.0.1" = "allow"
          EOF
      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          permission-profile: gradle-tests
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.json
          output-schema: |
            {
              "type": "object",
              "properties": {
                "summary": { "type": "string" },
                "comments": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "path": { "type": "string" },
                      "line": { "type": "integer" },
                      "body": { "type": "string" }
                    },
                    "required": ["path", "line", "body"],
                    "additionalProperties": false
                  }
                }
              },
              "required": ["summary", "comments"],
              "additionalProperties": false
            }
  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post Codex Feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let parsed;
            try {
              parsed = JSON.parse(process.env.CODEX_FINAL_MESSAGE);
            } catch (err) {
              // Output didn't match the schema; post the raw text so the feedback isn't lost.
              core.warning(`Could not parse Codex output as JSON (${err.message}); posting raw text.`);
              await github.rest.issues.createComment({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 issue_number: context.payload.pull_request.number,
                 body: process.env.CODEX_FINAL_MESSAGE,
              });
              return;
            }
            const { summary, comments } = parsed;
            const reviewComments = (comments || []).map(({ path, line, body }) => ({ path, line, side: "RIGHT", body }));
            
            try {
              await github.rest.pulls.createReview({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 pull_number: context.payload.pull_request.number,
                 commit_id: context.payload.pull_request.head.sha,
                 event: "COMMENT",
                 body: summary,
                 comments: reviewComments,
              });
            } catch (err) {
              // A single bad path/line anchor from the model 422s the whole review,
              // dropping the summary and every other comment along with it.
              core.warning(`createReview failed (${err.message}); falling back to a plain comment.`);
              const fallbackBody = [
                summary,
                "",
                "_Inline comments could not be posted, listed here unanchored:_",
                "",
                ...reviewComments.map((c) => `- **${c.path}:${c.line}** — ${c.body}`),
              ].join("\n");
            
              await github.rest.issues.createComment({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 issue_number: context.payload.pull_request.number,
                 body: fallbackBody,
              });
            }
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
